<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{if(localStorage.getItem("linhhoa_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<title>Practice Exam — Linh Hua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260926f">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Linh<span>Hua</span></a>
    <div class="nav-wrap" id="navWrap">
      <nav class="nav">
        <a href="course.html">Course</a>
      </nav>
      <div class="user-menu" id="userMenu">
        <button class="user-menu-trigger" id="userMenuTrigger" type="button" aria-label="Account menu">
          <span class="user-avatar" id="userAvatar"></span>
        </button>
        <div class="user-menu-dropdown" id="userMenuDropdown" hidden>
          <div class="user-menu-info">
            <strong id="userMenuName">&nbsp;</strong>
            <span id="userMenuEmail">&nbsp;</span>
          </div>
          <a href="dashboard.html">Dashboard</a>
          <a href="account.html">Account Settings</a>
          <button type="button" class="dropdown-theme-toggle js-theme-toggle" id="themeToggleDropdown">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
            <span class="dropdown-theme-toggle-label">Dark Mode</span>
          </button>
          <button type="button" id="logoutBtn">Log Out</button>
        </div>
      </div>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="examRoot">
  <section class="page-hero">
    <div class="hero-glow"></div>
    <div class="container">
      <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
      <span class="eyebrow" id="examEyebrow">Practice Exam</span>
      <h1>Test your knowledge</h1>
      <p>Unlimited practice questions pulled from the state exam content outline.</p>
    </div>
  </section>

  <section class="page-section">
    <div class="container exam-container">
      <div id="formMessage" class="form-message"></div>

      <div id="examIntro" class="exam-intro">
        <p id="examIntroText">Loading questions...</p>
        <button id="startExamBtn" class="btn btn-primary btn-lg">Start Exam</button>
      </div>

      <div id="examQuiz" class="exam-quiz" hidden>
        <div class="exam-status-bar">
          <span id="examProgress"></span>
          <span id="examTimer">0:00</span>
        </div>
        <div class="progress-bar-track"><div class="progress-bar-fill" id="examProgressFill" style="width: 0%;"></div></div>

        <button type="button" id="examNavToggle" class="exam-nav-toggle" aria-expanded="false">
          <span id="examNavToggleLabel">Jump to question</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div id="examNavigator" class="exam-navigator"></div>

        <h2 id="examQuestionText" class="exam-question"></h2>
        <div id="examListenContainer"></div>
        <div id="examOptions" class="exam-options"></div>
        <button id="examCheckBtn" type="button" class="btn btn-secondary">Check Answer</button>
        <p id="examFeedback" class="lesson-quiz-feedback" hidden></p>
        <p id="examExplanation" class="lesson-quiz-explanation" hidden></p>

        <div class="lesson-nav">
          <button id="examPrevBtn" class="btn btn-secondary">&larr; Previous</button>
          <button id="examNextBtn" class="btn btn-primary">Next &rarr;</button>
        </div>
      </div>

      <div id="examResults" class="exam-results" hidden>
        <div class="exam-score">
          <span id="examScorePercent" class="exam-score-percent"></span>
          <span id="examScoreLabel" class="exam-score-label"></span>
        </div>
        <p id="examTimeTaken" class="exam-time-taken"></p>
        <button id="retakeExamBtn" class="btn btn-primary">Retake Exam</button>
        <div id="examReview" class="exam-review"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <div class="container">
      <p>&copy; <span id="year"></span> Linh Hua. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script src="tts.js"></script>
<script src="practice-exam.js"></script>
</body>
</html>
