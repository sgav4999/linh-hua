<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{if(localStorage.getItem("linhhoa_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<title>Course — Linh Hua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261014a">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo"><img class="logo-mark" src="brand/logo-mark.svg" alt="" width="30" height="30"><span class="logo-word">Linh Hua</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-wrap" id="navWrap">
      <div class="user-menu" id="userMenu">
        <button class="user-menu-trigger" id="userMenuTrigger" type="button" aria-label="Account menu">
          <span class="user-avatar" id="userAvatar"></span>
        </button>
        <div class="user-menu-dropdown" id="userMenuDropdown" hidden>
          <div class="user-menu-info">
            <strong id="userMenuName">&nbsp;</strong>
            <span id="userMenuEmail">&nbsp;</span>
          </div>
          <a href="dashboard.html">Dashboard</a>
          <a href="account.html">Account Settings</a>
          <button type="button" class="dropdown-theme-toggle js-theme-toggle" id="themeToggleDropdown">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
            <span class="dropdown-theme-toggle-label">Dark Mode</span>
          </button>
          <button type="button" id="logoutBtn">Log Out</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="courseRoot">
  <section class="course-layout">
    <aside class="course-sidebar">
      <a href="dashboard.html" class="course-back">&larr; Back to Dashboard</a>
      <h1 id="courseTitle" class="course-sidebar-title">&nbsp;</h1>

      <div class="course-progress">
        <div class="course-progress-label">
          <span id="progressText">0 of 0 lessons complete</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
        </div>
      </div>

      <nav id="moduleList" class="module-list"></nav>
      <div class="course-sidebar-actions">
        <a href="practice-exam.html" id="coursePracticeExamLink" class="btn btn-secondary">Practice Exam</a>
        <a href="study-guide.html" id="courseStudyGuideLink" class="btn btn-secondary">Study Guide</a>
      </div>
    </aside>

    <div class="course-content">
      <div class="lesson-meta">
        <span class="eyebrow eyebrow-dark" id="lessonModuleLabel">Module</span>
        <span class="lesson-duration" id="lessonDuration"></span>
      </div>
      <h2 id="lessonTitle">&nbsp;</h2>
      <p class="lesson-description" id="lessonDescription"></p>
      <div id="lessonListenContainer"></div>

      <div id="lessonBody" class="lesson-body"></div>

      <div class="lesson-actions">
        <label class="lesson-complete-toggle">
          <input type="checkbox" id="completeCheckbox">
          Mark this lesson complete
        </label>
      </div>

      <div class="lesson-nav">
        <button id="prevLessonBtn" class="btn btn-secondary" disabled>&larr; Previous</button>
        <button id="nextLessonBtn" class="btn btn-primary">Next &rarr;</button>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <div class="container">
      <p>&copy; <span id="year"></span> Linh Hua. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script src="tts.js"></script>
<script src="course.js"></script>
</body>
</html>
