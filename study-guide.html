<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{if(localStorage.getItem("linhhoa_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<title>Study Guide — Linh Hua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261014b">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo"><img class="logo-mark" src="brand/logo-mark.svg" alt="" width="30" height="30"><span class="logo-word">Linh Hua</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-wrap" id="navWrap">
      <div class="user-menu" id="userMenu">
        <button class="user-menu-trigger" id="userMenuTrigger" type="button" aria-label="Account menu">
          <span class="user-avatar" id="userAvatar"></span>
        </button>
        <div class="user-menu-dropdown" id="userMenuDropdown" hidden>
          <div class="user-menu-info">
            <strong id="userMenuName">&nbsp;</strong>
            <span id="userMenuEmail">&nbsp;</span>
          </div>
          <a href="dashboard.html">Dashboard</a>
          <a href="account.html">Account Settings</a>
          <button type="button" class="dropdown-theme-toggle js-theme-toggle" id="themeToggleDropdown">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
            <span class="dropdown-theme-toggle-label">Dark Mode</span>
          </button>
          <button type="button" id="logoutBtn">Log Out</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="studyGuideRoot">
  <section class="page-hero">
    <div class="hero-glow"></div>
    <div class="container">
      <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>
      <span class="eyebrow" id="studyGuideEyebrow">Study Guide</span>
      <h1>Study Guide</h1>
      <p>A condensed summary of the key facts from every lesson — great for a final review before the exam.</p>
    </div>
  </section>

  <section class="page-section">
    <div class="container study-guide-container">
      <div class="study-guide-toolbar">
        <div class="study-guide-tabs" id="studyGuideTabs">
          <button type="button" class="study-guide-tab" data-course="life">Life</button>
          <button type="button" class="study-guide-tab" data-course="health">Health</button>
          <button type="button" class="study-guide-tab" data-course="life-health-combo">Life &amp; Health Combo</button>
        </div>
        <button type="button" class="btn btn-secondary" id="printGuideBtn">Print / Save as PDF</button>
      </div>

      <div id="studyGuideBody" class="study-guide-body">
        <p class="study-guide-loading">Loading study guide...</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-bottom">
    <div class="container">
      <p>&copy; <span id="year"></span> Linh Hua. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script src="study-guide.js"></script>
</body>
</html>
